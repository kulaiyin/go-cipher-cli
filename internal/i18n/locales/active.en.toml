# ==========================================
# cmd/key_derive.go
# ==========================================

[key_derive.short]
description = "Short description for key-derive command"
other = "Derive a key set (3 x 512-bit keys + UUID) from input and password"

[key_derive.long]
description = "Long description for key-derive command"
other = """Derive a key set of three independent 512-bit keys (S1/S2/S3) plus a 128-bit
UUID from an input text and a password, replicating the web tool's key-derivation
pipeline byte-for-byte.

Algorithm: HKDF(SHA3-512) salt derivation -> Argon2id(strength-tiered) master key ->
HKDF(SHA3-512) domain separation (S1/S2/S3/UUID).

--mode generate: produce a fresh key set with a new random salt and emit a
recovery config so the same set can be re-derived later.
--mode restore:  re-derive using the salt from an existing recovery config and
verify the result against the stored UUIDs.

Flags take priority; any missing required value is prompted interactively
(only when stdin is a terminal). Byte-level compatible with the web tool."""

[key_derive_pipe.short]
description = "Short description for key-derive-pipe command"
other = "Derive a key set from interactive input or a piped JSON object (wipeable secrets)"

[key_derive_pipe.long]
description = "Long description for key-derive-pipe command"
other = """Derive a key set of three 512-bit keys plus a UUID from input and password.
When stdin is a terminal the command prompts interactively (the password is
collected with echo disabled); otherwise it reads a JSON object on stdin
carrying mode/input/password/salt/hint/strength/config. The password never
enters argv or shell history, and every secret (password, derived keys,
intermediates) is carried as wipeable bytes and zeroed after use.

--mode generate: produce a fresh key set and emit a recovery config (to a file
or stdout) so the same set can be re-derived later.
--mode restore:  re-derive using the salt from an existing recovery config and
verify the result against the stored UUID fingerprints."""

