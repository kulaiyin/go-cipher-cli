# ==========================================
# cmd/key_derive.go
# ==========================================

[key_derive.short]
description = "Short description for key-derive command"
other = "Derive a key set (3 x 512-bit keys + UUID) from input and password"

[key_derive.long]
description = "Long description for key-derive command"
other = """Derive a key set of three independent 512-bit keys (S1/S2/S3) plus a 128-bit
UUID from an input text and a password, replicating the web tool's key-derivation
pipeline byte-for-byte.

Algorithm: HKDF(SHA3-512) salt derivation -> Argon2id(strength-tiered) master key ->
HKDF(SHA3-512) domain separation (S1/S2/S3/UUID).

--mode generate: produce a fresh key set with a new random salt and emit a
recovery config so the same set can be re-derived later.
--mode restore:  re-derive using the salt from an existing recovery config and
verify the result against the stored UUIDs.

Flags take priority; any missing required value is prompted interactively
(only when stdin is a terminal). Byte-level compatible with the web tool."""

[key_derive.flag.mode]
description = "Description for --mode flag"
other = "operation mode: generate (new key set) or restore (verify against --config)"

[key_derive.flag.input]
description = "Description for --input flag"
other = "input text (>= 20 non-space chars; combined with password to derive the keys)"

[key_derive.flag.password]
description = "Description for --password flag"
other = "password (prompted hidden if not given on the command line)"

[key_derive.flag.hint]
description = "Description for --hint flag"
other = "optional hint stored in the recovery config (defaults to the first 10 chars of input)"

[key_derive.flag.strength]
