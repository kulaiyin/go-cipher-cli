# ==========================================
# cmd/enhance.go
# ==========================================

[enhance.short]
description = "Short description for enhance command"
other = "Convert a password to a 256-bit high-entropy key (password-to-key)"

[enhance.long]
description = "Long description for enhance command"
other = """Generate a 256-bit high-entropy key from a password you can remember. The key
is what's actually used for encryption/authentication; the password is just the raw material.

Algorithm: Argon2id(64MB/3 rounds/1 parallelism) + HKDF-Expand(SHA-256) domain separation.
The same password + salt suffix deterministically derives the same key. The key cannot be reversed to recover the password.
Byte-level compatible with the web tool (https://tools.wcheer.com/)."""

[enhance.error.derive_failed]
description = "Error when key derivation fails"
other = "derive failed: {{.Err}}"

[enhance.output.algorithm]
description = "Algorithm label in output"
other = "Algorithm: Argon2id(64MB/3 rounds/1 parallelism) + HKDF-Expand(SHA-256)"

[enhance.output.domain]
description = "Domain label in output"
other = "Domain:   {{.Domain}}"

[enhance.output.salt_suffix]
description = "Salt suffix label in output"
other = "Salt suffix: {{.Suffix}}"

[enhance.output.key_hex]
description = "Key hex label in output"
other = "Key (hex):    {{.Key}}"

[enhance.output.key_base64]
description = "Key base64 label in output"
other = "Key (base64): {{.Key}}"

[enhance.output.key_length]
description = "Key length label in output"
other = "Key length:   {{.Bits}} bits (256 bit)"

[enhance.flag.password]
description = "Description for --password flag"
other = "password to convert (required)"

[enhance.flag.salt_suffix]
description = "Description for --salt-suffix flag"
other = "optional salt suffix (e.g. site name, device name); different suffixes produce different keys"

[enhance.flag.domain]
description = "Description for --domain flag"
other = "domain label (default default-v1, generally not changed)"

