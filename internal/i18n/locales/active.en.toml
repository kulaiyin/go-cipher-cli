[diceware.short]
description = "Short description for diceware command"
other = "Generate a Diceware passphrase (EFF word list, 7776 words)"

[diceware.long]
description = "Long description for diceware command"
other = """Use the EFF large word list (7776 words) with cryptographically secure random dice rolls to generate memorable but high-entropy passphrases.

Random source: crypto/rand (Go CSPRNG).
Each word provides ~12.9 bits of entropy: 5 words ~64.6 bits, 8 words ~103.4 bits.

Uses the same word list and algorithm as the web tool (https://tools.wcheer.com/)."""

