# ==========================================
# cmd/argon2id.go
# ==========================================

[argon2id.short]
description = "Short description for argon2id command"
other = "Derive a key with the Argon2id KDF"

[argon2id.long]
description = "Long description for argon2id command"
other = """Derive a key from a password using Argon2id. The same password + salt
deterministically derives the same key; the key cannot be reversed to recover
the password.

The password is read from a piped JSON object {"salt": "<hex>", "password":
"<secret>"} when stdin is piped or redirected, or prompted on a terminal with
echo disabled when stdin is a TTY; a piped run without a password falls back to
the terminal prompt. Memory is expressed in MB (default 64), iterations default
to 3, parallelism to 1, and the derived key length to 64 bytes."""

