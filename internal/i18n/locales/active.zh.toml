description = "--mode 标志的描述"
other = "操作模式：encrypt 或 decrypt（必填）"

[data_cipher.flag.key]
description = "--key 标志的描述"
other = "key-derive 产出的强密钥（128 位十六进制；密钥 1-3 最多重复 3 次）"

[data_cipher.flag.password]
description = "--password 标志的描述"
other = "password1（单值；需为高强度，或同时包含字母、数字和特殊字符且长度不小于 8 位）"

[data_cipher.flag.extra_password]
description = "--extra-password 标志的描述"
other = "可选的额外密码，追加到密钥集合末尾（无强度要求）"

[data_cipher.flag.salt]
description = "--salt 标志的描述"
other = "可选的 128 位十六进制盐种子（仅加密；省略则自动生成）"

[data_cipher.flag.hint]
description = "--hint 标志的描述"
other = "可选提示文本，写入 meta-data.json（仅加密）"

[data_cipher.flag.output]
