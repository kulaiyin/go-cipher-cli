other = "词数:         {{.Count}}"

[diceware.output.entropy]
description = "输出熵值标签"
other = "信息熵:       {{.Bits}} bit"

[diceware.output.combinations]
description = "输出组合数标签"
other = "可能组合数:   {{.Combinations}}"

[diceware.output.separator]
description = "输出分隔符标签"
other = "分隔符:       {{.Sep}}"

[diceware.output.details_header]
description = "逐词掷骰详情标题"
other = "逐词掷骰详情:"

[diceware.sep.hyphen]
description = "连字符分隔符描述"
other = "连字符 (-)"

[diceware.sep.none]
description = "无分隔符描述"
other = "无"

[diceware.sep.space]
description = "空格分隔符描述"
other = "空格"

[diceware.flag.num_words]
description = "--num-words 标志的描述"
other = "单词数量 (1-20)"

