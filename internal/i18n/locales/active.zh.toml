description = "--name 参数说明"
other = "挂载点名称（默认 default）"

[mntemp.flag.size]
description = "--size 参数说明"
other = "内存大小（MB，1-512，默认 24）"

[mntemp.flag.path]
description = "--path 参数说明"
other = "挂载路径（默认 /tmp/mntemp/<name>/）"

[param.error.required]
description = "必填参数缺失"
other = "缺少必填参数 --{{.Flag}}"

[param.error.allowed]
