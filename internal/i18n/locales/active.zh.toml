# cmd/diceware.go
# ==========================================

[diceware.short]
description = "diceware 命令的简短描述"
other = "生成 Diceware 助记口令（EFF 词表，7776 词）"

[diceware.long]
description = "diceware 命令的详细描述"
other = """用 EFF 大型词表（7776 词）和密码学安全随机掷骰，生成易记但高熵的口令。

随机数来源：crypto/rand (Go CSPRNG)。
每词提供约 12.9 bit 熵，5 词口令约 64.6 bit，8 词口令约 103.4 bit。

与 Web 工具 (https://tools.wcheer.com/) 的 Diceware 生成器同词表、同算法。"""

