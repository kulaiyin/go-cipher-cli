description = "请求使用 sudo 重试卸载"
other = "卸载需要 root 权限，是否使用 sudo 重试？"

[mntemp.umount.error.sudo_failed]
description = "sudo 卸载失败"
other = "sudo 卸载失败：{{.Err}}"

