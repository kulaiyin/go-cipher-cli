# ==========================================
# cmd/enhance.go
# ==========================================

[enhance.short]
description = "enhance 命令的简短描述"
other = "将密码转换为 256 位高熵密钥（密码转密钥）"

[enhance.long]
description = "enhance 命令的详细描述"
other = """用你记得住的常用密码生成一把 256 位高熵密钥，真正用于加密/认证的
是这把密钥，密码本身只是生成原料。

算法：Argon2id(64MB/3轮/1路并行) + HKDF-Expand(SHA-256) 域分离。
同一组密码 + 盐后缀确定性派生出相同密钥，无法由密钥反推密码。
与 Web 工具 (https://tools.wcheer.com/) 字节级互通。"""

[enhance.error.derive_failed]
description = "密钥派生失败的错误信息"
other = "派生失败: {{.Err}}"

[enhance.output.algorithm]
description = "输出的算法标签"
other = "算法:     Argon2id(64MB/3轮/1路并行) + HKDF-Expand(SHA-256)"

[enhance.output.domain]
description = "输出的域标签"
other = "Domain:   {{.Domain}}"

[enhance.output.salt_suffix]
description = "输出的盐后缀标签"
other = "盐后缀:   {{.Suffix}}"

[enhance.output.key_hex]
description = "输出的密钥 hex 标签"
other = "密钥(hex):     {{.Key}}"

[enhance.output.key_base64]
description = "输出的密钥 base64 标签"
other = "密钥(base64):  {{.Key}}"

[enhance.output.key_length]
description = "输出的密钥长度标签"
other = "密钥长度:      {{.Bits}} 位 (256 bit)"

[enhance.flag.password]
description = "--password 标志的描述"
other = "要转换的密码（必填）"

[enhance.flag.salt_suffix]
description = "--salt-suffix 标志的描述"
other = "可选盐后缀（如站点名、设备名），不同后缀派生不同密钥"

[enhance.flag.domain]
description = "--domain 标志的描述"
other = "域标签（默认 default-v1，一般不修改）"

# ==========================================
# cmd/argon2id.go
# ==========================================

[argon2id.short]
description = "argon2id 命令的简短描述"
other = "使用 Argon2id 从密码派生密钥"

[argon2id.long]
description = "argon2id 命令的详细描述"
other = """使用 Argon2id 从密码派生密钥。同一组 密码 + 盐 确定性派生出相同密钥，
无法由密钥反推密码。

指定 --secrets-stdin 时从标准输入读取（第 1 行口令, 第 2 行盐 hex）；标准输入为
终端时以关闭回显的方式交互式提示口令。标准输入被重定向但未指定 --secrets-stdin 时
拒绝读取口令，避免管道误接时从空口令静默派生。内存以 MB 为单位（默认 64），迭代默认
3 次，并行度默认 1，派生密钥长度默认 64 字节。使用 --json 可输出机器可读的 JSON 结果
（含处理耗时）。"""

[argon2id.error.derive_failed]
description = "argon2 派生失败的错误信息"
other = "argon2id 派生失败: {{.Err}}"

[argon2id.error.invalid_salt]
