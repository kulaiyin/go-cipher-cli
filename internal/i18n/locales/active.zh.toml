description = "挂载开始前的用途提示"
other = "将在 {{.Path}} 挂载临时内存文件系统，数据仅存于内存、{{.Shutdown}}。敏感文件请放置于此路径，完成后执行 {{.Umount}} 一键清理。"

[mntemp.mount.hint.shutdown]
