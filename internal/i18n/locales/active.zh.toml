# ==========================================
# cmd/key_derive.go
# ==========================================

[key_derive.short]
description = "key-derive 命令简短描述"
other = "从输入内容和密码派生一组密钥（3 把 512 位密钥 + UUID）"

[key_derive.long]
description = "key-derive 命令详细描述"
other = """从输入文本和密码派生一组密钥：三把相互独立的 512 位密钥（S1/S2/S3）外加一个 128 位
UUID，与网页端密钥派生流水线逐字节对齐。

算法：HKDF(SHA3-512) 派生盐值 -> Argon2id（按强度档位）生成主密钥 ->
HKDF(SHA3-512) 域分离（S1/S2/S3/UUID）。

--mode generate：用新的随机盐生成一组密钥，并输出恢复配置，便于日后重新派生出同一组密钥。
--mode restore：  用已有恢复配置中的盐重新派生，并与配置中存储的 UUID 比对校验。

命令行参数优先；任何缺失的必填项会在交互式下提示输入（仅当 stdin 是终端时）。
与网页端字节级兼容。"""

