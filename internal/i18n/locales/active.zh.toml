# ==========================================

[encrypt.use]
description = "encrypt 命令的 Use 字符串"
other = "encrypt [输入文件]"

[encrypt.short]
description = "encrypt 命令的简短描述"
other = "用 AES-256-GCM 加密文件（前端兼容容器）"

[encrypt.long]
description = "encrypt 命令的详细描述"
other = """使用与 Web 工具相同的密钥派生管道加密文件：
argon2id -> HMAC-SHA3-512 -> HKDF-SHA3-512 -> AES-256-GCM。

盐值存储在输出容器中，解密只需密码。如果省略 --salt 则自动生成。
输出是一个二进制容器（version|reserved|salt_seed|length|ciphertext），
Web 工具也可解密。"""

