description = "--hint 标志说明"
other = "可选提示，存入恢复配置（默认取输入内容前 10 个字符）"

[key_derive.flag.strength]
description = "--strength 标志说明"
other = "Argon2id 强度档位：basic | medium | advanced（默认 medium；越高越慢、占用内存越大）"

[key_derive.flag.salt]
description = "--salt 标志说明"
other = "128 位十六进制盐种子（仅 generate；默认随机生成）"

[key_derive.flag.config]
