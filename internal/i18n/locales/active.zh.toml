# ==========================================
# cmd/mntemp.go
# ==========================================

[mntemp.short]
description = "mntemp 命令简短描述"
other = "挂载内存临时文件系统"

[mntemp.long]
description = "mntemp 命令详细描述"
other = "在指定路径挂载一个基于 tmpfs 的 RAM 临时文件系统；平台不支持时回退为普通目录。"

