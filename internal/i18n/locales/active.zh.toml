# ==========================================
# cmd/data_cipher.go
# ==========================================

[data_cipher.short]
description = "data-cipher 命令简短描述"
other = "用 AES-256-GCM 加密/解密数据（Web 兼容的 ZIP 包）"

[data_cipher.long]
description = "data-cipher 命令详细描述"
other = """使用与 Web 数据加密工具相同的管道加密或解密数据：
argon2id -> HMAC-SHA3-512 -> HKDF -> AES-256-GCM，封装为 ZIP 包
（encrypted-data.bin + meta-data.json），带双重 HMAC 完整性校验。

--mode encrypt  : 输入文件 -> 加密 .zip
--mode decrypt  : 加密 .zip -> 原始文件

密码（-p）对应 Web 工具的 keys[]：前三个为 key-derive 产出的强密钥
（各 128 位十六进制），第四个为 password1。"""

