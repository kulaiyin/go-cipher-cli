name: Release

# Pushing a v* tag triggers the fully automated release pipeline:
#   compile -> build .deb -> GitHub Release -> APT repo metadata -> GPG signing
#   -> build VitePress docs -> deploy to GitHub Pages (gh-pages branch)
on:
  push:
    tags:
      - 'v*'
  # Allow manual triggering for debugging (uses the current tag, or v0.0.0 by default)
  workflow_dispatch:

permissions:
  contents: write   # goreleaser needs this to create the Release / upload assets
  pages: write      # needed to deploy Pages
  id-token: write   # needed for Pages OIDC deployment

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs the full git history

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Set up Node (for VitePress)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ---------- Stage 1: goreleaser packaging + GitHub Release ----------
      # Uses the official goreleaser-action, which installs a pinned goreleaser
      # version automatically. More reliable than installing via the APT repo
      # (whose key URL once failed with a 404).
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Stage 2: import GPG key for APT repo signing ----------
      - name: Import GPG signing key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::warning::GPG_SIGNING_KEY not configured; APT repo will be unsigned, clients need [trusted=yes]"
            exit 0
          fi
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --import --batch
          echo "GPG keys imported:"
          gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print "  key id: " $5}'

      # ---------- Stage 3: generate APT repo metadata ----------
      - name: Build APT repository metadata
        run: |
          # publish_repo.sh reads the key id from the SignWith line in
          # repo/conf/distributions automatically and signs with the private key
          # imported above. No need to set GPG_KEY explicitly here.
          bash scripts/publish_repo.sh

      # Export the public key to repo/repo.gpg.key; clients need it
      - name: Export GPG public key
        run: |
          KEY_ID=$(awk -F': ' '/^SignWith:/ {print $2}' repo/conf/distributions | tr -d ' ')
          if [ -n "$KEY_ID" ] && [ "$KEY_ID" != "YOUR-KEY-ID" ]; then
            gpg --armor --export "$KEY_ID" > repo/repo.gpg.key
            echo "Exported public key for $KEY_ID to repo/repo.gpg.key"
          else
            echo "::warning::No valid SignWith key, skipping public key export"
          fi

      # ---------- Stage 4: build VitePress docs ----------
      # Extract the version from the git tag into version.json so the docs site
      # navbar can show the current version. A tag like v0.2.0 becomes 0.2.0;
      # falls back to 0.0.0-dev when there is no tag.
      - name: Inject version into docs
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0-dev")
          VERSION="${VERSION#v}"
          echo "{\"version\": \"$VERSION\"}" > docs/.vitepress/version.json
          echo "Docs version: $VERSION"

      - name: Build VitePress docs
        run: |
          npm ci
          npm run docs:build

      # ---------- Stage 5: assemble deploy content ----------
      # Docs site at the root path, APT repo under the apt/ subpath; merge into
      # one directory and push to gh-pages
      - name: Assemble Pages content
        run: |
          set -e
          DEPLOY_DIR=$(mktemp -d)
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"
          # Docs site
          cp -r docs/.vitepress/dist/. "$DEPLOY_DIR/"
          # APT repo (conf/ is not published; clients don't need it)
          mkdir -p "$DEPLOY_DIR/apt"
          cp -r repo/dists repo/pool repo/repo.gpg.key "$DEPLOY_DIR/apt/" 2>/dev/null || true
          echo "=== Deploy tree ==="
          find "$DEPLOY_DIR" -maxdepth 3 -type f | sort | head -30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DEPLOY_DIR }}
          publish_branch: gh-pages
          force_orphan: true   # keep only the latest snapshot to avoid gh-pages history bloat
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy ${{ github.ref_name }} to GitHub Pages'
