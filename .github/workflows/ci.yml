name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # ---- No CJK in .go files ----
      - name: Check no CJK characters in Go source
        run: |
          hits=$(grep -rPn '[\x{4e00}-\x{9fff}\x{3000}-\x{303f}\x{ff00}-\x{ffef}]' --include='*.go' cmd/ internal/ main.go 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "CJK characters found in Go source:"
            echo "$hits"
            exit 1
          fi
          echo "OK"

      # ---- gofmt ----
      - name: gofmt
        run: |
          issues=$(gofmt -l .)
          if [ -n "$issues" ]; then
            echo "Files not gofmt'd:"
            echo "$issues"
            gofmt -d .
            exit 1
          fi
          echo "OK"

      # ---- go vet ----
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go build
        run: go build ./...
