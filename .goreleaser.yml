version: 2

project_name: go-cipher-cli

builds:
  - id: default
    main: ./main.go
    binary: go-cipher-cli
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -buildid=
      - -X main.date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: false
    # Fix the binary's owner/group/mtime so the archive is reproducible
    # across machines (local `developer` vs CI `runner` would otherwise
    # differ and change the checksum).
    builds_info:
      group: root
      owner: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    # List extra files explicitly so we can pin their owner/group/mtime.
    # An explicit `files` list replaces the default (LICENSE*/README*),
    # so there is no duplication.
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.zh-CN.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

nfpms:
  - id: default
    package_name: go-cipher-cli
    formats: [deb]
    mtime: "{{ .CommitDate }}"
    maintainer: kulaiyin <kly0214@163.com>
    homepage: https://github.com/kulaiyin/go-cipher-cli
    license: MIT
    section: utils
    priority: optional
    description: >
      A Go-based CLI tool for password-to-key derivation
      and Diceware passphrase generation.

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ .Version }}"

release:
  github:
    owner: kulaiyin
    name: go-cipher-cli
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
