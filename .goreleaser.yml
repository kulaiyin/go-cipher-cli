version: 2
project_name: go-cipher-cli

# In snapshot mode, use the real version number extracted from the git tag
# (e.g. v0.1.0 -> 0.1.0) instead of the default 0.0.0-SNAPSHOT-<commit>.
snapshot:
  version_template: "{{ .Version }}"

builds:
  - id: go-cipher-cli
    main: ./main.go
    binary: go-cipher-cli
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

nfpms:
  - id: deb
    package_name: go-cipher-cli
    maintainer: "kulaiyin <kly0214@163.com>"
    description: |
      A Go CLI tool for configuration, logging, interactive prompts, and progress.
    homepage: https://github.com/kulaiyin/go-cipher-cli
    license: MIT
    section: utils
    priority: optional
    formats:
      - deb

# Publish to GitHub Release: on a tag push, CI uses GITHUB_TOKEN to create the
# Release automatically and upload .deb / tar.gz / checksums.txt.
release:
  github:
    owner: kulaiyin
    name: go-cipher-cli
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"

