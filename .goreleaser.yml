version: 2

project_name: go-cipher-cli

builds:
  - id: default
    main: ./main.go
    binary: go-cipher-cli
    # Use the commit timestamp for binary & archive file modification times,
    # so identical source produces identical checksums on every build.
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -buildid=
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    wrap_in_directory: false

nfpms:
  - id: default
    package_name: go-cipher-cli
    formats: [deb]
    # Reproducible DEB: freeze file modification times to the commit date.
    mtime: "{{ .CommitDate }}"
    maintainer: kulaiyin <kly0214@163.com>
    homepage: https://github.com/kulaiyin/go-cipher-cli
    license: MIT
    section: utils
    priority: optional
    description: >
      A Go-based CLI tool for password-to-key derivation
      and Diceware passphrase generation.

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ .Version }}"

release:
  github:
    owner: kulaiyin
    name: go-cipher-cli
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
