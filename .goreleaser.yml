version: 2
project_name: go-cipher-cli

# snapshot 模式下使用真实版本号（从 git tag 提取，如 v0.1.0 -> 0.1.0），
# 而非默认的 0.0.0-SNAPSHOT-<commit>。
snapshot:
  version_template: "{{ .Version }}"

builds:
  - id: go-cipher-cli
    main: ./main.go
    binary: go-cipher-cli
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0

nfpms:
  - id: deb
    package_name: go-cipher-cli
    maintainer: "kulaiyin <kly0214@163.com>"
    description: |
      A Go CLI tool for configuration, logging, interactive prompts, and progress.
    homepage: https://github.com/kulaiyin/go-cipher-cli
    license: MIT
    section: utils
    priority: optional
    formats:
      - deb

# 发布到 GitHub Release：CI 在 push tag 时用 GITHUB_TOKEN 自动创建 Release
# 并上传 .deb / tar.gz / checksums.txt。
release:
  github:
    owner: kulaiyin
    name: go-cipher-cli
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"

