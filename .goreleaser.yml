version: 2

project_name: go-cipher-cli

gomod:
  proxy: true

builds:
  - id: default
    main: ./main.go
    binary: go-cipher-cli
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -buildid=
      - -X main.date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: false

nfpms:
  - id: default
    package_name: go-cipher-cli
    formats: [deb]
    mtime: "{{ .CommitDate }}"
    maintainer: kulaiyin <kly0214@163.com>
    homepage: https://github.com/kulaiyin/go-cipher-cli
    license: MIT
    section: utils
    priority: optional
    description: >
      A Go-based CLI tool for password-to-key derivation
      and Diceware passphrase generation.

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ .Version }}"

release:
  github:
    owner: kulaiyin
    name: go-cipher-cli
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
